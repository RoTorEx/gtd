[package]
name = "gtd"
version = "0.1.0"
edition = "2024"
description = "Interactive terminal reviewer for Todoist tasks"
license = "MIT"
repository = "https://github.com/RoTorEx/gtd"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
colored = "2"
ratatui = "0.29"
crossterm = "0.28"
open = "5"
